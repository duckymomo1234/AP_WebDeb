
<!DOCTYPE html>
<html>
<head>
    <title>Color Theory</title>
        <meta charset="UTF-8">
    <style>
        body {
            font: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }

        .box {
            width: 300px;
            height: 300px;
            font-size: 24px;
            font-weight: bold;
            border: 8px solid;
            box-sizing: border-box;
        }

        /* Complementary Colors */
        .complementary {
            background-color: rgb(116, 125, 255);
            color: rgb(250, 197, 97);
            border-color: rgb(250, 197, 97);
        }

        /* Analogous Colors */
        .analogous {
            background-color: rgb(252, 252, 118);
            color: rgb(152, 243, 152);
            border-color: rgb(148, 188, 68);
        }

        /* Triadic Colors */
        .triadic {
            background-color: rgb(255, 126, 126);
            color: rgb(252, 252, 118);
            border-color: rgb(116, 125, 255);
        }
    </style>
</head>
<body>

    <h1>Color Theory</h1>

    <div class="box complementary">
        Complementary
    </div>

    <div class="box analogous">
        Analogous
    </div>

    <div class="box triadic">
        Triadic
    </div>

</body>
</html>
