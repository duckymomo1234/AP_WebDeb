
<!DOCTYPE html>
<html>
<head>
    <title>Color Theory</title>
        <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }

        .box {
            width: 300px;
            height: 200px;
            font-size: 24px;
            font-weight: bold;
            border: 8px solid;
            box-sizing: border-box;
        }

        /* Complementary Colors */
        .complementary {
            background-color: blue;
            color: orange;
            border-color: orange;
        }

        /* Analogous Colors */
        .analogous {
            background-color: yellow;
            color: green;
            border-color: yellowgreen;
        }

        /* Triadic Colors */
        .triadic {
            background-color: red;
            color: yellow;
            border-color: blue;
        }
    </style>
</head>
<body>

    <h1>Color Theory</h1>

    <div class="box complementary">
        Complementary
    </div>

    <div class="box analogous">
        Analogous
    </div>

    <div class="box triadic">
        Triadic
    </div>

</body>
</html>
