<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Basic Website</title>
        <meta charset+"UTF-8">
        <style>
            #important{
                text-decoration: underline;
                color: blue
            }
            #attension{
                font-weight: bold;
            }
            #monkey{
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>Name of the website</h1>
        <p><span id="important">Paragraph tags</span> are used to display most of the <span id="attension">text</span> on the <span id="monkey">webpage. Woah woah woah</span></p>
        <h3>Sub header</h3>
        <p> We start a new paragraph tag when we want a new paragraph of the page. <br>This way things are easy to read</p>
    </body>
</html>
