<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Am I always right?</title>
        <meta charset+"UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color: purple;
                color: white;
                text-align: center;
                /*margin: 0 auto;*/

            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 100px;
                gap: 5px;
            }
            button{
                margin-top: 25px;
                padding: 5px;
            }
            #flex-wrapper{
                display: none;
                gap: 5px;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
            }
            img{
                width: 200px
            }
        </style>
        <head>

        </head>
        <body>
            <h1> Alignment notes</h1>
            <img scr="link" alt "timp" id="timp">
            <div  id="grid-wrapper"> 
                <div id="box"onmouseover="rotate">
                    <p>id="text"</p>
                </div>
                <div id="box">
                    <p>box 2</p>
                </div>
                <div id="box">
                    <p>box 3</p>
                </div>
                <div id="box">
                    <p>box 4</p>
                </div>
            </div>
             <div  id="flex-wrapper"> 
                <div id="box">
                    <p>box 1</p>
                </div>
                <div id="box">
                    <p>box 2</p>
                </div>
                <div id="box">
                    <p>box 3</p>
                </div>
                <div id="box">
                    <p>box 4</p>
                </div>
            </div>
            <input type="color" id="newColor">
            <br>
            <button onclick="changeColor()"> Click Me!</button>

            <script>
                let images = ["link2", "link3", "link4", "link"]
                let currentImage = 0
                function rotate(){
                    currentImage += 1
                    if (currentImage > 3){
                        currentImage = 0
                    }
                    document.getElementById("timp").src = images[currentImage]
            
                }
                function changeColor(){
                    let currentColor = document.getElementById("newColor").value
                    document.getElementById("box").style.backgroundColor = currentColor
                }
                function showHide(){
                    let item = document.getElementById("flex-wrapper").
                    if(item.style.display == "flex"){
                        item.style.display = "none"
                    }else{
                        item.style.display = "flex"
                    }
                }
            </script>
            
        </body>
</head>
